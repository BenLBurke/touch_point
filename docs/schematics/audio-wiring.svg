<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Consolas, Menlo, monospace" role="img" aria-label="Pi's USB port feeds a Waveshare USB-to-audio DAC. Its left-channel differential output, VOLP and VOLN, connects to the PAM8302 amplifier's A-plus and A-minus inputs; the right channel is unused. The PAM8302 draws Vin and GND from the Pi's own 5V and ground pins, with its shutdown pin bridged to Vin to keep it always enabled, and its output drives the speaker.">
  <rect x="0" y="0" width="900" height="360" fill="#EDEFF2"/>

  <rect x="20" y="130" width="150" height="90" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="95" y="180" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">Pi Zero W</text>

  <rect x="240" y="130" width="180" height="90" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="330" y="168" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">USB DAC</text>
  <text x="330" y="185" font-size="10.5" text-anchor="middle" fill="#565F6B">Waveshare USB-Audio</text>
  <text x="330" y="200" font-size="10.5" text-anchor="middle" fill="#565F6B">self-powered via USB</text>

  <rect x="500" y="130" width="180" height="120" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="590" y="163" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">PAM8302</text>
  <text x="590" y="180" font-size="10.5" text-anchor="middle" fill="#565F6B">2.5W Class-D amp</text>
  <text x="590" y="196" font-size="10.5" text-anchor="middle" fill="#565F6B">SD bridged → Vin</text>
  <text x="590" y="212" font-size="10.5" text-anchor="middle" fill="#565F6B">(always enabled)</text>

  <rect x="760" y="150" width="120" height="80" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="820" y="185" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">Speaker</text>
  <text x="820" y="202" font-size="10.5" text-anchor="middle" fill="#565F6B">PC83-8 target</text>

  <line x1="170" y1="175" x2="240" y2="175" stroke="#A87A1E" stroke-width="2" marker-end="url(#c1)"/>
  <text x="176" y="167" font-size="10.5" fill="#A87A1E">USB</text>

  <line x1="420" y1="160" x2="500" y2="160" stroke="#A87A1E" stroke-width="2" marker-end="url(#c1)"/>
  <text x="425" y="152" font-size="10" fill="#A87A1E">VOLP → A+</text>
  <line x1="420" y1="180" x2="500" y2="180" stroke="#A87A1E" stroke-width="2" marker-end="url(#c1)"/>
  <text x="425" y="198" font-size="10" fill="#A87A1E">VOLN → A−</text>

  <line x1="330" y1="220" x2="330" y2="250" stroke="#8B93A0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="330" y="265" font-size="10" text-anchor="middle" fill="#565F6B">VORP / VORN — unused (right ch.)</text>

  <line x1="680" y1="190" x2="760" y2="190" stroke="#A87A1E" stroke-width="2" marker-end="url(#c1)"/>
  <text x="686" y="182" font-size="10" fill="#A87A1E">out +/−</text>

  <line x1="95" y1="220" x2="95" y2="290" stroke="#B03F26" stroke-width="2"/>
  <line x1="95" y1="290" x2="590" y2="290" stroke="#B03F26" stroke-width="2" marker-end="url(#c2)"/>
  <text x="260" y="283" font-size="10.5" fill="#B03F26">Vin ← Pi 5V (Pin 2/4)</text>

  <line x1="120" y1="220" x2="120" y2="310" stroke="#3E6A6E" stroke-width="2"/>
  <line x1="120" y1="310" x2="590" y2="310" stroke="#3E6A6E" stroke-width="2"/>
  <text x="260" y="325" font-size="10.5" fill="#3E6A6E">GND ← Pi GND</text>

  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#A87A1E"/></marker>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#B03F26"/></marker>
  </defs>
</svg>
