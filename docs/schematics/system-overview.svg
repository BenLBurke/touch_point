<svg viewBox="0 0 920 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Consolas, Menlo, monospace" role="img" aria-label="Block diagram: a 5V supply feeds both the Pi and the LED ring on separate branches; the Pi connects to the RC522 reader over SPI0, to the LED ring over a single PWM GPIO for data only, and down to a USB-plus-GPIO-power audio chain.">
  <rect x="0" y="0" width="920" height="480" fill="#EDEFF2"/>

  <rect x="280" y="30" width="260" height="80" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="410" y="62" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">5V DC Supply</text>
  <text x="410" y="80" font-size="11" text-anchor="middle" fill="#565F6B">+ terminal block</text>

  <rect x="30" y="180" width="220" height="100" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="140" y="222" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">RC522</text>
  <text x="140" y="240" font-size="11" text-anchor="middle" fill="#565F6B">RFID reader</text>

  <rect x="350" y="180" width="220" height="100" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="460" y="222" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">Pi Zero W</text>
  <text x="460" y="240" font-size="11" text-anchor="middle" fill="#565F6B">touchpoint.py</text>

  <rect x="670" y="180" width="220" height="100" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="780" y="222" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">WS2812B Ring</text>
  <text x="780" y="240" font-size="11" text-anchor="middle" fill="#565F6B">48px</text>

  <rect x="350" y="360" width="220" height="100" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="460" y="402" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">Audio Chain</text>
  <text x="460" y="420" font-size="11" text-anchor="middle" fill="#565F6B">see audio-wiring.svg</text>

  <line x1="380" y1="110" x2="460" y2="180" stroke="#B03F26" stroke-width="2" marker-end="url(#a1)"/>
  <text x="330" y="150" font-size="11" fill="#B03F26">5V / GND</text>

  <line x1="480" y1="110" x2="780" y2="180" stroke="#B03F26" stroke-width="2" marker-end="url(#a1)"/>
  <text x="610" y="140" font-size="11" fill="#B03F26">5V / GND — separate branch</text>

  <line x1="250" y1="230" x2="350" y2="230" stroke="#1F7A84" stroke-width="2" marker-end="url(#a2)"/>
  <text x="255" y="222" font-size="11" fill="#1F7A84">SPI0</text>

  <line x1="570" y1="230" x2="670" y2="230" stroke="#6B4FA8" stroke-width="2" marker-end="url(#a3)"/>
  <text x="573" y="222" font-size="11" fill="#6B4FA8">GPIO18 · PWM0</text>

  <line x1="460" y1="280" x2="460" y2="360" stroke="#A87A1E" stroke-width="2" marker-end="url(#a4)"/>
  <text x="468" y="320" font-size="11" fill="#A87A1E">USB + GPIO 5V/GND</text>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#B03F26"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#1F7A84"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#6B4FA8"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#A87A1E"/></marker>
  </defs>
</svg>
