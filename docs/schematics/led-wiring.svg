<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Consolas, Menlo, monospace" role="img" aria-label="Power supply feeds the LED ring's 5V and ground directly. The Pi's GPIO18 drives the ring's data-in line with no series resistor or decoupling capacitor. The power supply ground and the Pi ground are tied together.">
  <rect x="0" y="0" width="760" height="300" fill="#EDEFF2"/>

  <rect x="20" y="20" width="180" height="80" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="110" y="65" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">5V Supply</text>

  <rect x="20" y="190" width="180" height="80" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="110" y="235" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">Pi Zero W</text>

  <rect x="560" y="100" width="180" height="100" rx="3" fill="#E1E4E9" stroke="#1B2027"/>
  <text x="650" y="145" font-size="13" text-anchor="middle" font-weight="600" fill="#1B2027" font-family="ui-sans-serif, system-ui, sans-serif">WS2812B Ring</text>
  <text x="650" y="163" font-size="11" text-anchor="middle" fill="#565F6B">48 px</text>

  <line x1="200" y1="55" x2="560" y2="130" stroke="#B03F26" stroke-width="2" marker-end="url(#b1)"/>
  <text x="280" y="80" font-size="11" fill="#B03F26">5V</text>

  <line x1="200" y1="80" x2="560" y2="150" stroke="#3E6A6E" stroke-width="2"/>
  <text x="280" y="100" font-size="11" fill="#3E6A6E">GND</text>

  <line x1="200" y1="220" x2="560" y2="175" stroke="#6B4FA8" stroke-width="2.5" marker-end="url(#b2)"/>
  <text x="270" y="245" font-size="11" fill="#6B4FA8">GPIO18 → DIN</text>

  <text x="380" y="205" font-size="11" text-anchor="middle" font-weight="600" fill="#B23A3A" font-family="ui-sans-serif, system-ui, sans-serif">⚠ no series resistor, no cap here</text>

  <line x1="110" y1="100" x2="110" y2="190" stroke="#3E6A6E" stroke-width="1.75" stroke-dasharray="5 3"/>
  <text x="118" y="150" font-size="10" fill="#3E6A6E">common GND — required</text>

  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#B03F26"/></marker>
    <marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#6B4FA8"/></marker>
  </defs>
</svg>
