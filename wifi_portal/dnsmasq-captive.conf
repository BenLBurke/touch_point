# Captive-portal DNS redirect for the onboarding access point.
#
# NetworkManager runs its own internal dnsmasq for any connection using
# `ipv4.method shared` (which is how wifi_portal.networking.start_ap()
# brings up the onboarding AP) -- it automatically picks up config
# snippets dropped in /etc/NetworkManager/dnsmasq-shared.d/. This one
# redirects every DNS lookup to the Pi itself, which is what makes
# phones auto-detect a captive portal and pop the setup page: whatever
# hostname a phone's connectivity check resolves, it gets this AP's own
# address back instead of a real answer.
#
# Installed by commands/setup/install_wifi_portal.sh.
address=/#/10.42.0.1
